name: CI & Release Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests & Ablation Suites
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run Swift Tests
        run: swift test --parallel

  build-and-package:
    name: Build & Package (macOS arm64)
    needs: test
    runs-on: macos-14
    permissions:
      contents: write
    env:
      KEYCHAIN_PATH: ""
      HAS_SIGNING_SECRETS: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_NOTARY_SECRETS: ${{ (secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '') || (secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_KEY_BASE64 != '') }}
      HAS_SPARKLE_SECRET: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # Step 1: Optional Setup Keychain for Apple Developer ID Signing
      - name: Install Apple Certificate (if secrets provided)
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          BUILD_KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)
          
          # Create and configure ephemeral keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$BUILD_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$BUILD_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$BUILD_KEYCHAIN"
          
          # Import Developer ID certificate (.p12)
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$BUILD_KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          
          # Authorize codesign partition to prevent GUI interactive prompts
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$BUILD_KEYCHAIN"
          security default-keychain -s "$BUILD_KEYCHAIN"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$BUILD_KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          
          echo "KEYCHAIN_PATH=$BUILD_KEYCHAIN" >> "$GITHUB_ENV"

      # Step 2: Build App Bundle & CLI
      - name: Build App & CLI (arm64)
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: |
          DEVELOPER_ID="${SIGNING_IDENTITY:-Developer ID Application: Patrick Fu (9N7UKH59LC)}"
          if [ -n "$KEYCHAIN_PATH" ]; then
            echo "Building with Developer ID signing ($DEVELOPER_ID)..."
            DEVELOPER_ID="$DEVELOPER_ID" ./scripts/build-app.sh arm64
          else
            echo "Building unsigned artifact (secrets not configured)..."
            DEVELOPER_ID="" ./scripts/build-app.sh arm64
          fi

      # Step 3: Create DMG Installer
      - name: Package DMG Installer
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: |
          DEVELOPER_ID="${SIGNING_IDENTITY:-Developer ID Application: Patrick Fu (9N7UKH59LC)}"
          if [ -n "$KEYCHAIN_PATH" ]; then
            echo "Packaging DMG with Developer ID signing ($DEVELOPER_ID)..."
            DEVELOPER_ID="$DEVELOPER_ID" ./scripts/build-dmg.sh
          else
            echo "Packaging unsigned DMG..."
            DEVELOPER_ID="" ./scripts/build-dmg.sh
          fi

      # Step 4: Notarize DMG with Apple notarytool (if secrets provided)
      - name: Notarize DMG (App-Specific Password or API Key)
        if: env.HAS_NOTARY_SECRETS == 'true' && env.KEYCHAIN_PATH != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          APPLE_TEAM_ID="${TEAM_ID_SECRET:-9N7UKH59LC}"
          DMG_PATH="dist/VibeKey-Elements-macOS-arm64.dmg"
          echo "Submitting DMG to Apple Notarization service..."
          
          if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_KEY_BASE64" ]; then
            echo "Authenticating via App Store Connect API Key..."
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_"${APPLE_API_KEY_ID}".p8
            xcrun notarytool submit "$DMG_PATH" \
              --key ~/.appstoreconnect/private_keys/AuthKey_"${APPLE_API_KEY_ID}".p8 \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait
          else
            echo "Authenticating via Apple ID App-Specific Password..."
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          fi

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG_PATH"
          echo "Notarization and stapling successfully completed!"

      # Step 5: Always Clean Up Ephemeral Keychain
      - name: Clean Up Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      # Step 6: Upload Artifacts
      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeKey-Elements-macOS-arm64
          path: dist/VibeKey-Elements-macOS-arm64.dmg
          if-no-files-found: error

      # Step 6.5: Update Sparkle Appcast on Tag Release (if secrets provided)
      - name: Update Sparkle Appcast
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SPARKLE_SECRET == 'true'
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          echo "==> Updating appcast.xml with Sparkle release signature..."
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          GENERATE_APPCAST="$(find .build -name generate_appcast | head -n 1)"
          if [ -n "$GENERATE_APPCAST" ] && [ -x "$GENERATE_APPCAST" ]; then
            echo "$SPARKLE_KEY" | "$GENERATE_APPCAST" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/patrick-fu/vibekey-elements/releases/download/${TAG_NAME}/" \
              -o appcast.xml \
              dist/
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add appcast.xml
            git diff-index --quiet HEAD || git commit -m "Update Sparkle appcast for ${TAG_NAME}"
            git push origin HEAD:main || true
          fi

      # Step 7: Create GitHub Release on Tag
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VibeKey-Elements-macOS-arm64.dmg
            appcast.xml
          draft: false
          prerelease: false
          generate_release_notes: true
